name: Order & Stock Maintenance Cron

# CLAUDE.md §5.3 / secure_checklist.md §5
# Periodically invokes the background maintenance endpoint to:
# 1. Release expired stock reservations (15+ mins without payment)
# 2. Cancel unpaid abandoned orders at Stripe
# 3. Retry undelivered customer receipt/confirmation emails from the outbox queue

on:
  schedule:
    # GitHub Actions scheduled workflow runs every 5 minutes (standard minimum interval)
    # Note: On Cloudflare Cron Triggers or Linux crontab, interval can be configured to every 1 minute.
    - cron: "*/5 * * * *"
  workflow_dispatch:
    # Allows manual trigger at any time from GitHub Actions UI

permissions:
  contents: read

jobs:
  maintenance-orders:
    name: Run Background Maintenance Worker
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Invoke Order Maintenance Endpoint
        env:
          STOREFRONT_URL: ${{ secrets.PRODUCTION_STOREFRONT_URL }}
          MAINTENANCE_SECRET: ${{ secrets.MAINTENANCE_SECRET }}
        run: |
          if [ -z "$STOREFRONT_URL" ] || [ -z "$MAINTENANCE_SECRET" ]; then
            echo "⚠️ Skipping: PRODUCTION_STOREFRONT_URL or MAINTENANCE_SECRET is not configured in GitHub Secrets."
            echo "Please set these in repository settings -> Secrets and variables -> Actions."
            exit 0
          fi

          # Strip trailing slash if present
          CLEAN_URL="${STOREFRONT_URL%/}"
          ENDPOINT="${CLEAN_URL}/api/maintenance/orders"

          echo "🚀 Invoking maintenance worker at: ${ENDPOINT}"

          HTTP_RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            -X POST "${ENDPOINT}" \
            -H "Authorization: Bearer ${MAINTENANCE_SECRET}" \
            -H "Content-Type: application/json" \
            --max-time 30)

          HTTP_BODY=$(echo "$HTTP_RESPONSE" | sed -e '$d')
          HTTP_STATUS=$(echo "$HTTP_RESPONSE" | tail -n1 | sed -e 's/HTTP_STATUS://')

          echo "Response Status: ${HTTP_STATUS}"
          echo "Response Body: ${HTTP_BODY}"

          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "✅ Maintenance run completed successfully."
            exit 0
          elif [ "$HTTP_STATUS" -eq 503 ]; then
            echo "⚠️ Maintenance run partially succeeded (some jobs failed, will retry next tick)."
            exit 0
          else
            echo "❌ Maintenance worker failed with HTTP ${HTTP_STATUS}."
            exit 1
          fi
